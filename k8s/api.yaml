apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: pharmacy-api }
  template:
    metadata:
      labels: { app: pharmacy-api }
    spec:
      containers:
        - name: api
          image: pharmacy-api:local
          imagePullPolicy: Never
          env:
            - { name: DB_URL, value: "jdbc:mysql://mysql:3306/pharmacy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" }
            - { name: DB_USER, value: pharmacy }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mysql-secret, key: MYSQL_PASSWORD } }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: pharmacy-api
spec:
  selector: { app: pharmacy-api }
  ports: [{ port: 8080, targetPort: 8080 }]
  type: ClusterIP
